name: 每日晨報

# 台北 07:00 前後出刊（UTC 22:30 / 23:05 / 23:40 = 台北 06:30 / 07:05 / 07:40）。
# 排三次是因為 GitHub 對公開 repo 的排程只是 best-effort，常被延後或整次丟掉。
# 同一期只寫一次：第一個跑成的那一輪出刊之後，後面兩輪在「今天出刊了沒」就停下。
# 寫過一次卻沒寫成（花了錢、檢查沒過）的那天，排程也不再重試——要重寫請手動觸發。
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "5 23 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:          # 手動重寫（不受出刊時段限制）

# 跟 build.yml 同一個並行群組：兩邊都會提交 site/，同一時間只准一個在跑，另一個排隊，
# 不會兩邊搶推。（GitHub 的規則：同一群組裡排隊中的舊執行會被更新的取代，所以晨報偶爾
# 會被緊接著的兩次建置擠掉——上面那三個排程就是為這個留的。）
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

# 整個 job 都要有資料源的金鑰：快取的鍵是含金鑰的網址，寫稿時的摘要與之後的離線重建
# 沒有金鑰就讀不到快取（2026-10-15 第一次實跑就是這樣：205 檔全缺，重建中止）。
env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ref: main，不是觸發當下的那個提交：這個 job 常在 build.yml 後面排隊，排到的時候
      # main 已經多了一個建置提交。拿舊的提交來建，site/ 每一頁都會跟它衝突
      # （2026-10-15 手動觸發那一次就是這樣，寫好的一期在提交時丟了）。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 今天出刊了沒
        id: due
        run: python3 tools/morning_brief.py --check

      # 以下照 build.py 的路子先建置一輪：晨報的數字只能來自這一輪抓到的資料。
      - name: 還原資料快取
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: macro-cache-${{ github.run_id }}
          restore-keys: |
            macro-cache-

      - name: 測試
        if: steps.due.outputs.due == 'true'
        run: python3 -m unittest discover -s tests

      - name: 建置（抓最新資料）
        if: steps.due.outputs.due == 'true'
        run: python3 build.py --ttl 3000 --quiet

      # 寫稿只在這一步用到第三方套件（官方 SDK，版本釘死）；網站本體照舊零依賴。
      # 失敗不會讓這一步變紅：失敗紀錄（data/morning/failed-日期.json）還要提交，
      # 最後一步再依 published 決定要不要標紅。
      - name: 寫晨報
        id: write
        if: steps.due.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet "anthropic==1.14.0"
          python3 tools/morning_brief.py

      - name: 重建頁面（加上這一期）
        id: rebuild
        if: steps.write.outputs.published == 'true'
        run: python3 build.py --offline --no-archive --quiet

      # fresh_state.json 不提交：它是 build.yml 判斷「這一輪才公布、要推播」的基準。
      # 這裡提交了，下一輪建置就會以為那些公布早已推過。
      # always()：前面哪一步失敗都要把寫好的那一期或失敗紀錄提交——不提交的話，下一個
      # 排程看不到今天已經寫過，會再花一次錢重寫（2026-10-15 就這樣寫了三次）。
      # 重建失敗時 site/ 是第一輪建置的產物（或沒變），那一期等下一次建置上站。
      # 期間 main 若又多了別人的提交（本機的要聞整理、手動推送）而 site/ 撞在一起：
      # 照 CLAUDE.md 的規矩不逐行解衝突——取遠端版本，把這一期放回去，重建，再提交一次。
      - name: 提交
        id: commit
        if: always() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- data/fresh_state.json 2>/dev/null || true
          mkdir -p /tmp/morning-keep
          cp data/morning/*.json /tmp/morning-keep/ 2>/dev/null || true
          git add site data/morning data/archive data/quotes_snapshot.json \
                  data/series_dates.json data/fedfunds_snapshot.json
          if git diff --cached --quiet; then
            echo "沒有變更，跳過 commit"
            exit 0
          fi
          git commit -q -m "晨報 ${{ steps.due.outputs.date }}"
          if git pull --rebase --autostash origin main && git push; then
            exit 0
          fi
          echo "跟遠端的建置產物衝突：取遠端版本、放回這一期、重建後再提交"
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/morning            # 第一期之前遠端還沒有這個目錄
          cp /tmp/morning-keep/*.json data/morning/
          python3 build.py --offline --no-archive --quiet \
            || echo "::warning::重建失敗：只提交這一期，頁面等下一次建置"
          git checkout -- data/fresh_state.json 2>/dev/null || true
          git add site data/morning
          git diff --cached --quiet || git commit -q -m "晨報 ${{ steps.due.outputs.date }}"
          git push

      # 只有這一輪真的出刊、頁面也重建好了才推（同一期只推一次）。推播失敗不影響出刊。
      - name: 晨報推播
        if: >-
          steps.write.outputs.published == 'true' && steps.rebuild.outcome == 'success' &&
          steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install --quiet pywebpush
          python3 tools/send_push.py --morning

      - name: 沒有出刊就標紅
        if: steps.due.outputs.due == 'true' && steps.write.outputs.published != 'true'
        run: |
          echo "晨報沒有出刊，原因在「寫晨報」那一步的紀錄裡"
          exit 1
